[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-region-classifier"
version = "1.0.0"
description = "A real-time GPS sensor simulation with distance-based region classification."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
py-modules = ["tracker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
